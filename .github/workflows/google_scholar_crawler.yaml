name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: get-citation-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Test citation data contract offline
        working-directory: google_scholar_crawler
        run: python -m unittest discover -s tests -v

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch and validate fresh citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          PUBLICATION_LIMIT: '200'
        run: |
          python main.py
          python citation_data.py results

      - name: Publish successful results
        run: |
          stats_dir="${RUNNER_TEMP}/google-scholar-stats"
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin refs/heads/google-scholar-stats
            git worktree add --detach "${stats_dir}" FETCH_HEAD
          else
            lookup_status=$?
            if [ "${lookup_status}" -ne 2 ]; then
              exit "${lookup_status}"
            fi
            git worktree add --detach "${stats_dir}" HEAD
            git -C "${stats_dir}" switch --orphan google-scholar-stats
          fi
          cp google_scholar_crawler/results/gs_data.json \
             google_scholar_crawler/results/gs_publications.json \
             google_scholar_crawler/results/gs_data_shieldsio.json "${stats_dir}/"
          git -C "${stats_dir}" config user.name 'github-actions[bot]'
          git -C "${stats_dir}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "${stats_dir}" add -- gs_data.json gs_publications.json gs_data_shieldsio.json
          if git -C "${stats_dir}" diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git -C "${stats_dir}" commit -m 'Updated Citation Data'
          git -C "${stats_dir}" push origin HEAD:refs/heads/google-scholar-stats
