<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
        <button type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="site-nav-links"><div class="navicon" aria-hidden="true"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url | escape_once }}">{{ link.title | escape_once }}</a></li>
          {% endfor %}
        </ul>
        <ul id="site-nav-links" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
