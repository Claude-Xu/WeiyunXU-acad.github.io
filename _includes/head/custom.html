<style>
  .wx-carousel{position:relative;margin:1.2rem 0 2rem;border-radius:12px;overflow:hidden}
  .wx-carousel__viewport{ aspect-ratio: 4 / 3; width:100%; overflow:hidden; }
  .wx-carousel__track{ display:flex; height:100%; will-change:transform; }
  .wx-carousel__slide{ min-width:100%; height:100%; margin:0; }
  .wx-carousel__slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  @media (max-width: 600px){.wx-carousel__viewport{ aspect-ratio: 4 / 3; }}

  .wx-carousel__btn{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.35);color:#fff;width:44px;height:44px;border-radius:999px;cursor:pointer;font-size:30px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  .wx-carousel__btn--prev{left:10px}
  .wx-carousel__btn--next{right:10px}

  .wx-carousel__pause{position:absolute;top:10px;right:10px;border:0;border-radius:6px;padding:6px 10px;min-height:32px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
  .wx-carousel__dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:2px}
  .wx-carousel__dot{width:24px;height:24px;padding:0;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer}
  .wx-carousel__dot:before{content:"";width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.55)}
  .wx-carousel__dot.is-active:before{background:rgba(255,255,255,.95)}
  .wx-carousel button:focus-visible,.greedy-nav button:focus-visible{outline:3px solid #005fcc;outline-offset:2px;box-shadow:0 0 0 5px #fff}
  .no-js .wx-carousel__btn,.no-js .wx-carousel__pause,.no-js .wx-carousel__dots{display:none}
  @media (prefers-reduced-motion: reduce){.wx-carousel__track{transition:none!important;will-change:auto}}
</style>
